<!doctype html>
<html lang="en">
  <head>
    <title>The service is busy or unavailable - Collections Navigator - University of Melbourne</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <style>
      body { background: #fff; color: #261b23; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; line-height: 1.5; margin: 0; }
      main { margin: 0 auto; max-width: 36rem; padding: 3rem 1.25rem; }
      h1 { font-size: 1.75rem; line-height: 1.25; margin: 0 0 1rem; }
      a { color: #003f8b; text-underline-offset: 0.12em; }
      p.code { color: #5a4a55; font-size: 0.875rem; }
    </style>
  </head>
  <body>
    <!-- This file lives in public/503.html. The site's own page (ErrorsController) is sent when it can be drawn. -->
    <main>
      <h1>The service is busy or unavailable</h1>
      <p>We can't reach part of the service just now. Nothing you did caused this. Please try again in a few minutes.</p>
      <p><a href="/">Go to the home page</a></p>
      <p class="code">Error 503</p>
    </main>
  </body>
</html>
