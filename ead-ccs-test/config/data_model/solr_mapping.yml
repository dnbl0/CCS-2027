# Maps the workbooks' display fields (field_labels.json, by seq) and filters (filters.json, by seq)
# to the Solr fields the indexers write (app/indexers/collections/*). Every field and filter has
# either `solr:` (the field to show or facet on) or `gap:` (why it has no data yet; a gap field is not shown, a gap filter is shown with a note). Nothing
# here invents data: a gap stays a gap until a source column exists. DataModel loads this file and
# test/models/data_model_test.rb checks it against the workbooks.
#
# Keys are the FINAL SEQUENCE ORDER of the 19/10 workbook (the `seq` of field_labels.json) and the # of its CCS Filters sheet
# (24 is the project owners' unnumbered "With Digital Asset" row after #23). filters: `facet:` is the facet key when it is not
# the Solr field (a query facet).
# fields: `index: true` also shows the field in the search results list.
fields:
  1:  { solr: title_tsim }                     # the record heading, not repeated in the details list
  2:  { solr: object_type_ssim, index: true }
  3:  { solr: production_date_ssim, index: true }
  4:  { solr: creator_display_ssim, index: true }   # "Name (born - died) Role", from the creator columns
  5:  { solr: associated_entity_ssim }
  6:  { solr: cultural_group_ssim }            # EMu "Cultural Group" (2 records populated)
  7:  { solr: production_place_ssim, index: true }
  8:  { solr: series_ssim }
  9:  { gap: "Neither export has an Editions column." }
  10: { solr: material_ssim }                  # EMu "Medium" and "Extent and Medium"; Vernon has none
  11: { gap: "Neither export has a dimensions column." }
  12: { gap: "Neither export has an inscription column." }
  13: { gap: "Inventory: language is held by neither M&C nor MDHS; EMu's Language Group column is empty." }
  15: { solr: subject_ssim }                    # EMu only
  16: { solr: description_tsim }               # Vernon only: the EMu export has no description column
  17: { solr: classification_ssim }
  18: { solr: named_collection_ssim }
  19: { solr: collection_ssim, index: true }
  20: { solr: accession_number_ssim }
  21: { solr: credit_line_tsim }
  22: { solr: rights_ssim }
  23: { gap: "No source URL column in either export (the record page uses a placeholder link)." }
  24: { gap: "Inventory: physical access is held by neither system. EMu's Record Status (access_condition_ssi) is indexed but not shown; it is not an access condition and needs data-owner sign-off." }
  25: { solr: parent_record_ssi }
  26: { gap: "DAM field: no Nexus DAM export yet." }
  27: { gap: "DAM field: no Nexus DAM export yet." }
  28: { gap: "DAM field: no Nexus DAM export yet." }
  29: { gap: "DAM field: no Nexus DAM export yet." }

filters:
  1:  { solr: collection_ssim }
  2:  { solr: named_collection_ssim }
  3:  { solr: creator_ssim }
  4:  { solr: creator_role_ssim }             # the 19/10 workbook lists it between Creator Name and the birth date
  5:  { solr: creator_birth_isim }             # four-digit years parsed from EMu's birth dates
  6:  { solr: creator_death_isim }
  7:  { solr: nationality_ssim }                # dev-team ingest (2026-11): free text, e.g. "Australian composer and pianist"; the filter reads nationality_term_ssim once index:normalise has written it (NormalisedTerms)
  8:  { solr: date_start_isi }
  9:  { solr: date_era_ssim }                   # dev-team ingest: "20th century", "19th century" ...
  10: { solr: classification_ssim }
  11: { solr: object_type_ssim }
  12: { solr: material_ssim }                   # the filter reads material_term_ssim once index:normalise has written it (NormalisedTerms)
  13: { gap: "Language is not held by either system." }
  14: { solr: region_ssim }                     # dev-team ingest: Oceania, Europe, Asia ...
  15: { solr: subject_ssim }
  16: { solr: subject_agent_ssim }              # dev-team ingest; sparse (about 330 records)
  17: { solr: associated_entity_place_ssim }   # EMu only, sparsely populated
  18: { gap: "No subject event in either export." }
  19: { solr: dam_licence_ssim }                # the DAM licence (DA License Type), written by the DAM sync (Dam::SolrWriter)
  20: { solr: digital_asset_advisory_classification_ssim }  # dev-team ingest: G, PG, M, MA 15+ ... (about 24 records)
  21: { solr: object_access_condition_ssim }    # dev-team ingest; one value ("Open") so far
  22: { solr: dam_access_tier_ssi }             # AccessPolicy tier from the DAM licence (DAM sync): open, view_only, request
  23: { solr: digital_asset_format_ssim }      # "Image" for the records that have a digital asset
  24: { solr: has_digital_asset_bsi, facet: has_digital_asset }  # the project owners' "With Digital Asset" (Yes / No), CCS-41's filter: a
                                                # query facet under its old key, so saved searches and links (f[has_digital_asset][]=with) keep working
