- title: "CSIRAC Collection"
  slug: "csirac-collection"
  url: "https://collections.museumsvictoria.com.au/articles/3145"
  image_url: "https://collections.museumsvictoria.com.au/content/media/41/279391-medium.jpg"
  image_alt: "Computer, workstation, cabinets, desk, papers on display."
  image_caption: "CSIRAC on display"
  summary: "The CSIRAC Computer collection consists of over 300 objects, over 300 images and over 1,000 documents relating to the CSIRAC computer."
  site: "Museums Victoria"
  collection: "Engineering and Information Technology Collection"
  author: "Mr David Demant; Dr Michelle Stevenson"
  licence: "CC BY"
  licence_url: "https://creativecommons.org/licenses/by/4.0"
  body: "<p>The CSIRAC Computer collection consists of over 300 objects, over 300 images and over 1,000 documents relating to the CSIRAC computer. First run in 1949 and fully operational by 1951 CSIRAC was the first stored memory digital electronic computer in Australia and the fourth in the world. </p>\n<p>Its significance comes from its pioneering contribution to software development and computer training; and its computation of scientific, industrial and business problems in Australia. In addition, CSIRAC is now the only remaining and intact first generation computer in the world, as a result its components, peripheral equipment and Archive are today unique artefacts from this early period of computing. </p>\n<p>CSIRAC's first home was the CSIR (later CSIRO) Radiophysics Laboratory in Sydney. In 1955 the computer was transferred to the University of Melbourne, where it continued in operation until November 1964. In March 1965, CSIRAC was donated by CSIRO to the&nbsp;Institute of Applied Science of Victoria (now&nbsp;Museums Victoria). The museum has continued collecting objects, images, documents and oral histories relating to CSIRAC to further enhance the collection. </p>\n<p>The collection is composed of two key parts CSIRAC's hardware and related equipment and the CSIRAC archive. The hardware collection comprises the complete machine and its peripherals;&nbsp;including&nbsp;ten cabinets of electronic circuitry, paper tape reading, writing and editing equipment, control console, test equipment, disk drive, mercury delay line storage unit&nbsp;and miscellaneous components. </p>\n<p>The CSIRAC archive contains material documenting the computer from its conception in the late 1940s to its decommissioning in 1964. The archive includes: 458 paper tape reels comprising CSIRAC's complete software library, CDs containing programs read from paper tapes, program documentation, programming manuals, documents relating to courses, annual reports, plans for the Laboratory, staff information, published papers and reports, and correspondence, original photographs, film footage, oral histories, engineering drawings and some miscellaneous objects. </p>\n<p>In 1996 the University of Melbourne established the CSIRAC History Project which resulted in members of the CSIRAC History Team working closely with Museum Victoria staff in the documentation of the CSIRAC collection and the development of the CSIRAC exhibition at Melbourne Museum. </p>\n<p>The comprehensive nature of the CSIRAC collection enhances the story of how CSIRAC operated, and provides important display objects that enable the public to access the themes surrounding CSIRAC.</p>"
