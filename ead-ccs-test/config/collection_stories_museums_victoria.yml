- title: "Ron Bowles, Computer Engineer & CSIRAC Specialist (1922-2004)"
  slug: "ron-bowles-computer-engineer-and-csirac-specialist-1922-2004"
  url: "https://collections.museumsvictoria.com.au/articles/2408"
  image_url: "https://collections.museumsvictoria.com.au/content/media/19/256319-medium.jpg"
  image_caption: "Ron Bowles, 1967"
  summary: "Ron was a founding member of the University Computation Laboratory established in 1955. The Computation Laboratory housed Australia's first (and in 1955/56 only) computer CSIRAC."
  site: "Museums Victoria"
  collection: "Engineering and Information Technology Collection"
  author: "Ms Ruth Leveson"
  licence: "CC BY"
  licence_url: "https://creativecommons.org/licenses/by/4.0"
  body: "<p>Ron was a founding member of the University Computation Laboratory established in 1955.</p>\n<p>The Computation Laboratory housed Australia's first (and in 1955/56 only) computer CSIRAC.</p>\n<p>Ron was the engineer who brought it from Sydney where it had been built in the late 1940s and was a central figure in the establishment of computing here and in the operation and maintenance of CSIRAC until it was retired in 1964.</p>\n<p>The Computation Laboratory grew to became a University department and in 1970, was split into an academic department (the forerunner of CSSE and IS) and a service department (the forerunner of Information Technology Services).</p>\n<p>Ron stayed with the Computer Centre/ITS until his retirement.</p>\n<p>During the 1990s&nbsp;Ron was&nbsp;coming to CSSE each week as a member of the CSIRAC history team. He was been a key player in the reconstruction of the CSIRAC music (now recognised as the first computer music).</p>"
