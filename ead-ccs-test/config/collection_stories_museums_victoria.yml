- title: "Lexie Luly Collection"
  slug: "lexie-luly-collection"
  url: "https://collections.museumsvictoria.com.au/articles/17128"
  image_url: "https://collections.museumsvictoria.com.au/content/media/21/594321-medium.jpg"
  image_alt: "Young woman in nurse's uniform and teenage boy stand on a verandah."
  image_caption: "Gwendolen Luly in Nurse's Uniform & Boy on Verandah of the Alfred Hospital, Prahran, 1918-1919"
  summary: "Between 1986 and 2006 Miss Lexie Luly progressively donated material to Museums Victoria, totalling 264 items."
  site: "Museums Victoria"
  collection: "Engineering and Information Technology Collection"
  author: "Ms Deborah Tout-Smith"
  licence: "CC BY"
  licence_url: "https://creativecommons.org/licenses/by/4.0"
  body: "<p>Between 1986 and 2006 Miss Lexie Luly progressively donated material to Museums Victoria, totalling 264 items. The collection includes World War II Air Raid Precautions items; booklets from a similar era;&nbsp;sewing samples; lantern slides; woodwork samples; badges; photographs; and domestic items. </p><p>Lexie Luly was born in&nbsp;1924, grew up in Altona&nbsp;as a child and lived most of her life in the Preston/Reservoir area, in Melbourne's&nbsp;inner north. She attended Presbyterian Ladies College, and was awarded a scholarship in 1941 to attend&nbsp;Emily McPherson College to undertake a diploma in needlecraft. She&nbsp;also studied at RMIT and attended night school at Preston Tech, adding both&nbsp;art and dressmaking to her studies. She later became&nbsp;a teacher at Presbyterian Ladies College, and was Head of PLC Art 1956-1983.</p><p>Her extensive travels included a trip to England in 1948 and returning in 1950, and a 1956&nbsp;world trip to the United States (where she visited Central High School, Omaha, Nebraska), Indo-China, Burma, India, Israel, Egypt, England, Germany and Japan. </p><p>Gwendolen Luly (1898-1988), likely Lexie's paternal aunt, is depicted in some of the photographs in the collection. Gwen attended the University Practising School (later University High School) from 1911 to 1913, became a nurse and established St Clement's Private Hospital in Southey Street, St Kilda. In 1939 she cancelled the hospital's registration and spent the war years running the Altona Air Raid Precautions.</p><p>In 2010 Miss Luly was interviewed by Darebin Heritage, recalling life in&nbsp;war-time Melbourne. She <span lang=\"EN-AU\">explained that during the war&nbsp;the daughter of one of her neighbours, Vera Lugton, was also an Air Raid Warden. </span></p><p>Miss Luly donated a significant collection of photographs of Melbourne to the University of Melbourne taken by her father&nbsp;in the&nbsp;1950s-1970s. Evan Luly (1895-1985) was born in Preston in 1895 and lived there all his life. He worked for the Victorian Lands Department, and was a keen traveller and photographer.</p><p>Miss Luly donated items to other collections including the State Library of Victoria (her photographs), National Gallery of Victoria,&nbsp;Victorian Arts Centre collection, Australian Sports Museum,&nbsp;Australian War Memorial&nbsp;and PLC Melbourne Archive. </p><p><strong>References</strong></p><p>Luly Collection <a href=\"https://melbourne.figshare.com/articles/dataset/Luly_Collection/11691861/1\">https://melbourne.figshare.com/articles/dataset/Luly_Collection/11691861/1</a></p><span lang=\"EN-AU\"><p>1941 'THE WORLD OF WOMEN', The Argus (Melbourne, Vic. : 1848 - 1957), 22 February, p. 8. , viewed 07 Jul 2021, <a href=\"http://nla.gov.au/nla.news-article8175502\">http://nla.gov.au/nla.news-article8175502</a>.</p><p>Lexie Luly, interviewed by Darebin Heritage, 2021, online at https://heritage.darebinlibraries.vic.gov.au/article/731, accessed 7 Jul 2021.</p><p>The Australian Women's Register <a href=\"https://www.womenaustralia.info/biogs/AWE6114b.htm\">https://www.womenaustralia.info/biogs/AWE6114b.htm</a>, accessed 7 Jul 2021.</p><p>1949 'FRIEND OF THE BAY FISHERMEN' [re. Gwen Luly], Williamstown Chronicle (Vic. : 1856 - 1954), 4 November, p. 1. , viewed 07 Jul 2021, <a href=\"http://nla.gov.au/nla.news-article70708120\">http://nla.gov.au/nla.news-article70708120</a>.</p><p><em>PLC Newsletter</em>, 27 October 2017, accessed online at <a href=\"https://educationdocbox.com/Private_School/82317399-Plc-newsletter-senior-school-junior-school-early-learning-centre-friday-27-october-2017-week-3b.html\">https://educationdocbox.com/Private_School/82317399-Plc-newsletter-senior-school-junior-school-early-learning-centre-friday-27-october-2017-week-3b.html</a>, 8 Jul 2021.</p><p>Central High Register, Central High School, Omaha, Nebraska, 29 Oct 1956, p.4, accessed online at <a href=\"http://omahachsarchives.org/archive/register/1956-10-29_03.pdf\">http://omahachsarchives.org/archive/register/1956-10-29_03.pdf</a>, 8 Jul 2021.</p><p><strong><br></strong></p><p><strong>See also:</strong> Royal&nbsp;Historical Society of Victoria files&nbsp;Gwen Luly (1898-1988), Volume 1, 1898 - 1927; Volume 2, 1920s - 1988 (made by Lexie Luly); Luly, Lexie; MS 001138 .001 (Box 261-1).</p></span><p><br>&nbsp;<br></p>"
