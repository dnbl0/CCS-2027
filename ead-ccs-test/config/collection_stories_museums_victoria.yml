- title: "Early radio: transmission and reception, 1900 - 1914"
  slug: "early-radio-transmission-and-reception-1900-1914"
  url: "https://collections.museumsvictoria.com.au/articles/12667"
  image_url: "https://collections.museumsvictoria.com.au/content/media/34/661284-medium.jpg"
  image_caption: "Ship's radio room before 1920"
  summary: "The period from 1900 to the beginning of the First World War saw the key events in the birth of radio as a communication technology."
  site: "Museums Victoria"
  collection: "Engineering and Information Technology Collection"
  author: "Mr Michael (Mike) R. Osborne"
  licence: "CC BY"
  licence_url: "https://creativecommons.org/licenses/by/4.0"
  body: "<p>The period from 1900 to the beginning of the First World War saw the key events in the birth of radio as a communication technology. The following text briefly describes the transmission and receiving processes for this early period. </p>\n<p><strong>The Transmission Process</strong> </p>\n<p>This process could involve high or low powered systems; the latter were used in emergencies. </p>\n<p><em><strong>High Powered System</strong></em></p>\n<p><em>Stage 1:</em> A morse code signal is keyed into the system. <br><em>Stage 2:</em> High powered systems use alternating current at around 500 Hz from a rotary converter via a high voltage transformer to charge the main capacitor. <br><em>Stage 3:</em> The signal then passes through a keying relay, which protects the morse operator (and the key) from the high voltages and currents required by the transmitter. The morse key could not stand up to the high energies involved in controlling the sparks.&nbsp;<br><em>Stage 4: </em>A coil then maximises the transfer of energy from the alternating voltage source (the rotary converter) to the main capacitor.&nbsp;<br><em>Stage 5:</em> The voltage is then stepped up to a high enough value to break down the spark gap using a transformer.&nbsp;<br><em>Stage 6:</em> Choke coils isolate the spark circuit from the secondary of the transformer.<br><em>Stage 7:</em> The signal in the form of the keyed high voltage developed on the main capacitor is discharged via a spark gap (discharger). <br><em>Stage 8:</em> The energy in the main capacitor excites the oscillatory transformer to produce a damped oscillation at the resonant frequency. <br><em>Stage 9:</em> The energy of the main oscillatory circuit is matched to aerial by the aerial tuning inductance. <br><em>Stage 10: </em>A tune indicator is used to allow the operator to adjust the aerial tuning inductance to maximise the radio frequency current in the aerial, indicated by maximum brightness of the lamp. In a typical ship's installation an earth arrestor is used to isolate the receiver from the transmitter during transmission, allowing the receiver to share the same aerial. </p>\n<p><strong><em>Low Powered&nbsp;System</em></strong> </p>\n<p>A low powered system can work in two ways. In the earlier and simpler system, the spark coil is connected directly to the aerial, producing a broadband signal, which is likely to be picked up ships in the area regardless of the listening frequency. The second system, the tuned coil system, the spark coil is connected to the main capacitor and creates a spark across the existing discharger which excites the aerial in the normal way. </p>\n<p>Low power or emergency transmitters use an induction coil as a high voltage source for the spark. They are controlled directly by the morse key. Capacitors are used across the interrupter of the induction coil to minimise sparking. </p>\n<p><strong>The Receiving Process </strong></p>\n<p><em>Stage 1: </em>An incoming signal from an aerial passes through a multiple tuner, which selects the required receiving frequency. A multiple tuner has more than one tuning circuit. The multiple tuner contains a tapped inductor and variable capacitor to tune the aerial followed by two further tuned circuits to increase selectivity and to match the output to the low impedance of the signal coil of the magnetic detector with which the multiple tuner was designed to work. <br><em>Stage 2:</em> The output from the tuner is fed to a detector, which was initially a coherer, later to be replaced by a magnetic detector, crystal detector and thermionic valve. <br><em>Stage 3:</em> When a magnetic detector was used, its output was connected to earphones (known as telephones at the time). An adjustable capacitor, known as a telephone condenser, was placed across the output of the magnetic detector in parallel with earphones. The capacitor is adjusted to resonate with the inductance of the output circuit at the repetition frequency of the transmitter, making the signal easier to hear. Where a coherer was used, a morse inker could be used to produce a permanent record of the signal. Coherers were more suited to shore-based stations than ships.</p>"
