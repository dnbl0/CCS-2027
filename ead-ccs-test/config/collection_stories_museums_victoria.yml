- title: "Trevor Pearcey & the First Australian Computer: A Lost Opportunity?"
  slug: "trevor-pearcey-and-the-first-australian-computer-a-lost-opportunity"
  url: "https://collections.museumsvictoria.com.au/articles/1348"
  image_url: "https://collections.museumsvictoria.com.au/content/media/36/256336-medium.jpg"
  image_caption: "CSIR Radiophysics research staff, 1952"
  summary: "This is a summary of an article entitled 'Trevor Pearcey & the First Australian Computer: A Lost Opportunity?' The paper tells something of Trevor Pearcey's early contribution to Australian…"
  site: "Museums Victoria"
  collection: "Engineering and Information Technology Collection"
  author: "Mr John B. Willis; Mr J. F. Deane"
  licence: "CC BY"
  licence_url: "https://creativecommons.org/licenses/by/4.0"
  body: "<p>This is a summary of an article entitled 'Trevor Pearcey &amp; the First Australian Computer: A Lost Opportunity?'</p>\n<p>The paper tells something of Trevor Pearcey's early contribution to Australian computing. </p>\n<p>Shortly after the Second World War Trevor Pearcey joined the Radiophysics Division of the Australian Council for Scientific and Industrial Research (CSIR), the predecessor of today's Commonwealth Scientific and Industrial Research Organization (CSIRO). He designed the first Australian electronic computer, which was constructed in the Division. By 1951 this machine was functioning, but three years later a decision was made to discontinue work on computer development in CSIRO. Pearcey however went on to play a vital role in Australian computing, both in CSIRO and in academia.</p>\n<p>The paper also takes a fresh look at some of the factors involved in the 1954 decision to terminate computer development in CSIRO. </p>"
