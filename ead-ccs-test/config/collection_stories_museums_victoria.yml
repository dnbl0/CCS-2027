- title: "Royal Exhibition Building Collection"
  slug: "royal-exhibition-building-collection"
  url: "https://collections.museumsvictoria.com.au/articles/359"
  image_url: "https://collections.museumsvictoria.com.au/content/media/24/466824-medium.jpg"
  image_caption: "Medal - Opening of the First Commonwealth Parliament, Melbourne, 1901"
  image_credit: "Photographer: Taryn Ellis"
  summary: "The Royal Exhibition Building is a product of the optimism, enthusiasm and energy of the people of Melbourne in the late 19th century."
  site: "Museums Victoria"
  collection: "Engineering and Information Technology Collection"
  author: "Ms Elizabeth Willis"
  licence: "CC BY"
  licence_url: "https://creativecommons.org/licenses/by/4.0"
  body: "<p>The Royal Exhibition Building is a product of the optimism, enthusiasm and energy of the people of Melbourne in the late 19th century. In 1879, when the foundation stone was laid, Melbourne was an extremely prosperous city, basking in the wealth from the richest gold rush in the world. The future seemed unlimited, and Victorians wanted to publicise their achievements in an international exhibition. </p>\n<p>The building was designed by Joseph Reed and erected in less than 18 months. The first exhibition opened on 1 October 1880. The excited crowd included many who had immigrated during the 1850's gold rush. They had seen Melbourne change from a scatter of wooden houses to a marvellous modern city. The new Exhibition Building, the largest building in Australia, was a symbol of their confidence in the future. The 1880-81 International Exhibition attracted entries from 33 countries and over a million visitors. </p>\n<p>The boom times continued, and in 1888 at the Centennial International Exhibition, annexes full of displays covered the gardens north to Carlton Street, and people made 2 million visits. </p>\n<p>The Opening of the First Federal Parliament of the Commonwealth of Australia on 9 May 1901 saw 12,000 people attend the ceremony in the Great Hall. The restored interior replicates the decorative scheme designed for that event. </p>\n<p>In 1919, the building was used as a temporary hospital for Spanish Flu sufferers; from 1921-1925 the first Australian War Museum was housed there (the precursor to the Australian War Memorial); between 1941 and 1945 the building was requisitioned by the RAAF No 1 Technical Training School; from 1949-1962 a migrant reception centre was housed in the grounds north of the great hall; and in 1956 weight liftingting, basketball and wrestling competitions were held as part of the Melbourne Olympics. Between these events the building has continued to be used for trade fairs, motor shows, balls, meetings, flower shows, examinations and rock concerts. </p>\n<p>To mark its centenary in 1980, Princess Alexandra, cousin to Queen Elizabeth II, bestowed Royal title on the Exhibition Building. Its significance as the only surviving 19th century 'Palace of Industry' located in its original landscape setting, still used for events, saw the Royal Exhibition Building listed on the World Heritage Register in July 2004.</p>\n<p>The Royal Exhibition Collection of well over 5,000 objects reflects all aspects of the building's history: objects displayed at the two great International Exhibitions; souvenirs; certificates and medals awarded to exhibitors and commissioners; invitations to concerts, balls and the opening of parliament: catalogues to the International Exhibition and museum displays. The collection also contains photographs of the building from the 1880s to the present day, and other pictorial reproductions including watercolours, postcards and lithographic prints.</p>"
