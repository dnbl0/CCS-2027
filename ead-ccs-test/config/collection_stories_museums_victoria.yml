  licence_url: "https://creativecommons.org/licenses/by/4.0"
  body: "<p>The School of Engineering was created at the University of Melbourne in November 1860. Engineering has been taught continuously at the University of Melbourne since 1861. The school opened with one lecturer and 15 students who attended lectures on two evenings each week. The first Engineering Degree was not awarded until 1883, and is celebrated in a medal issued in 1983 to commemorate the centenary (NU 13500). </p>\n<p></p>\n<p><strong>References:<br></strong>University of Melbourne Faculty of Engineering website <a href=\"http://www.eng.mu.oz.au/eng/index.html\">http://www.eng.mu.oz.au/eng/index.html</a><br>Melbourne University Engineering Foundation web site <a href=\"http://www.eng.mu.oz.au/muef/\">http://www.eng.mu.oz.au/muef/</a></p>"
