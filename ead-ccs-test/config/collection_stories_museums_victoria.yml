  summary: "The nucleus of the I&T Museum's early collections consisted of exhibits that had been displayed at the Intercolonial Exhibition of 1866-1867, together with a collection of mining models, miners'…"
  site: "Museums Victoria"
  collection: "Engineering and Information Technology Collection"
  author: "Matthew Churchward"
  licence: "CC BY"
  licence_url: "https://creativecommons.org/licenses/by/4.0"
  body: "<p>The nucleus of the I&amp;T Museum's early collections consisted of exhibits that had been displayed at the Intercolonial Exhibition of 1866-1867, together with a collection of mining models, miners' tools and agricultural equipment models that McCoy had put together from 1856 as part of the National Museum based at the University. The one exception were the prized Nordstrom mining models, which McCoy refused to transfer to the new museum and managed to retain until his death in 1899.</p>\n<p>The following is a list of some of the more significant multiple item acquisitions made over the past 150 years:<br>1860&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/2807\">Canning Indian Mutiny Collection</a><br>1872&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/1187\">Wax Fruit Collection</a><br>1875&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/1522\">Whatmough Collection</a><br>1880&nbsp; <a href=\"/stories/royal-exhibition-building-collection\">Royal Exhibition Building Collection</a><br>1880&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/2798\">Poonah Clay Figure Collection</a><br>1882&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/2872\">Sargood Arms Manufacture Collection</a><br>1885&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/1232\">May Vale Timber Collection</a><br>1887&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/1188\">T.N. Mukharji Collection</a><br>1915&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/3046\">Telegraphy Collection</a><br>1915&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/2627\">J.J. Thompson Telegraphy Collection</a><br>1943&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/3028\">William Cole Arms Collection</a><br>1945&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/1657\">Melbourne Observatory Collection</a><br>1965&nbsp; <a href=\"/stories/csirac-collection\">CSIRAC Collection</a><br>1974&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/3561\">Motor Cycle Collection</a><br>1980&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/15252\">Gerald &amp; Lorna Dee Collection</a><br>1981&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/3257\">Printing Type Collection</a><br>1984&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/2670\">Antarctica Collection</a><br>1985&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/3154\">Lilian Louisa Pitts Collection</a><br>1985&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/3156\">Bill Boyd Photographic Collection</a><br>1986&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/16668\">C.H. Nowell Horticultural Collection</a><br>1986&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/3153\">Vickers Ruwolt Collection</a><br>1987&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/3157\">Daniel Harvey Collection</a><br>1989&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/2683\">Simpson's Gloves Collection</a><br>1990&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/3713\">Francis Collection</a><br>1990&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/2970\">Dr Thomas George Beckett Collection</a><br>1990&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/3516\">Rodda Collection</a><br>1991&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/2641\">Whelan the Wrecker Collection</a><br>1992&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/3158\">International Harvester (IH) Collection</a><br>1993&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/3519\">State Electricity Commission of Victoria (SECV) Collection</a><br>1994&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/4623\">William McCook Windmills Collection</a><br>1995&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/2736\">H.V. McKay Sunshine Collection</a><br>1995&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/2878\">Laurie Richards Collection</a><br>1995&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/1506\">West Gate Bridge Collection</a><a href=\"https://collections.museumsvictoria.com.au/articles/3159\"></a><br>2000&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/3724\">Victorian Women on Farms Gathering Collection</a><br>2001&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/3501\">G.H. Myers Collection</a><br>2001&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/3517\">Medical Ephemera Collection</a><br>2001&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/1495\">CSIRAC Archive &amp; Paper Tape Library Collection</a><br>2001&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/13422\">Jack Chisholm Fencing Collection</a><br>2004&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/3511\">CSL (Commonwealth Serum Laboratories) Collection</a><br>2004&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/2864\">Trade Literature Collection</a><br>2005&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/2964\">Baker &amp; Rouse Collection</a><br>2005&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/1367\">Paragon Shoe Collection</a><br>2005&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/3356\">Harold P. Wood Collection</a><br>2005&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/2882\">Kodak Heritage Collection</a><br>2006&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/1521\">A.J. Campbell Collection</a><br>2006&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/1523\">Internet Macintosh User Group (iMug) Collection</a><br>2008&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/15199\">Bionic Ear Collection</a><br>2008&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/3584\">Fairfield Hospital Collection</a><br>2009&nbsp; <a href=\"https://collections.museumsvictoria.com.au/articles/3032\">Victorian Bushfires Collection</a><br></p>\n<p>Below are links to a selecton significant and representative individual collections items in the Technology collections of Museums Victoria acquired over the past 150 years.</p>\n<p>&nbsp;</p>"
