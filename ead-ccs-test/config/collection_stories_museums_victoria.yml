- title: "A timeline of the Development of Radio, 1821 - 1914"
  slug: "a-timeline-of-the-development-of-radio-1821-1914"
  url: "https://collections.museumsvictoria.com.au/articles/12668"
  image_url: "https://collections.museumsvictoria.com.au/content/media/34/661284-medium.jpg"
  image_caption: "Ship's radio room before 1920"
  summary: "Events & Discoveries that led to the use of Radio: 1821 - 1902 A number of important events and discoveries preceded the practical realisation of radio, or 'wireless telegraphy' as it was originally…"
  site: "Museums Victoria"
  collection: "Engineering and Information Technology Collection"
  author: "Mr Michael (Mike) R. Osborne"
  licence: "CC BY"
  licence_url: "https://creativecommons.org/licenses/by/4.0"
  body: "<p><strong>Events &amp; Discoveries that led to the use of Radio: 1821 - 1902 </strong></p>\n<p>A number of important events and discoveries preceded the practical realisation of radio, or 'wireless telegraphy' as it was originally called. </p>\n<p>1821: Hans Christian Oersted discovers that an electric current creates a magnetic field. </p>\n<p>1831: Michael Faraday finds that a changing magnetic field would generate an electric current. </p>\n<p>Circa 1837: the electric telegraph appeared on both sides of the Atlantic in about 1837. </p>\n<p>1865: James Clerk Maxwell determines the mathematical integration of the observed relationships between electricity and magnetism. These equations correctly predicted the speed of light (based on the measurable electromagnetic properties of free space) leading Maxwell to conclude that light was an electromagnetic wave. </p>\n<p>1887: Heinrich Hertz established that electromagnetic waves could be generated by electrical means. </p>\n<p>1894 to 1896: Guglielmo Marconi, after two years of experimentation, successfully transmitted radio signals over a distance of about 1.5 km. </p>\n<p>1896: Marconi moved to England. </p>\n<p>1897: Marconi granted patent for his system of wireless telegraphy. He set up the 'Wireless Telegraph and Signal Company Ltd' to commercialise his system. A short time later the name was changed to 'Marconi's Wireless Telegraph Company Ltd.' The remainder of the 19th century was spent experimenting and demonstrating with longer and longer paths culminating successful signalling across the English Channel. </p>\n<p>Circa 1898: synchronised tuning to maximise the transfer of energy between two tuned circuits was demonstrated by Oliver Lodge. </p>\n<p>1900: Marconi developed tuned transmitters that concentrated the transmitted power into a narrow band centred on a controllable frequency; he also developed receivers that could be tuned to a specified frequency. This allowed multiple stations to operate in the same area without interfering with each other. Before this time, all spark systems were essentially untuned, the only frequency dependent elements were the transmitting and receiving aerials themselves which were normally made to be of similar dimensions to achieve the best results. Lack of tuning meant that the transmitted signal covered a rather wide bandwidth and the receivers were unable to select a particular signal. </p>\n<p>1901: Marconi carried out the first trans-Atlantic transmission. The receiver used a coherer and was essentially untuned. </p>\n<p>1902: Marconi tested ship (receiver) to shore (transmitter). </p>\n<p><strong>Early use of Radio: 1900 - 1914 </strong></p>\n<p>The period from&nbsp;1900&nbsp;to 1914 contained the key events in the development of radio. During this time it moved from a scientific curiosity, only experienced in the laboratory or in large-scale scale experiments and demonstrations to the stage where wireless equipment was becoming common on ships. </p>\n<p>The main use of radio at that time was for ship to shore and ship to ship communication. During this period radio communication was telegraphic and was referred to as 'wireless telegraphy'. Although the Fleming diode and DeForest audion were invented during this period they were not widely used. </p>\n<p>The main components of a wireless telegraph station were a spark transmitter and a receiver which could be based on a crystal detector, a magnetic detector or a coherer. None of these detectors were particularly sensitive and no means of amplifying the radio frequency signal existed so to achieve a useful range, aerials had to be as large as possible and the transmitter power had to be as high as was practicable. A typical ship's spark transmitter was rated at 1.5 kW. Frequencies used tended to be low as it was believed at that time that the longer the wavelength the better the range. Wavelengths from 6000 m to 600 m (50 kHz to 500 kHz) were where most of the activity took place.</p>"
