# Themed collections (/themes, ThemesController, docs/categories-themes-stories.md).
#
# PLACEHOLDER: every title and intro below is example wording (lorem ipsum) that needs the collections team's approval before launch.
# The filters use real index fields and values, so the pages show real records.
#
# Each theme:
#   slug      the address, /themes/<slug> (lower case letters, digits and hyphens)
#   title     the page heading
#   intro     a short introduction (plain text)
#   filters   Blacklight facet filters: { field: [values] }; every field must be a filter of the search page
#   range     optional: { begin: year, end: year } on date_start_isi (the Date filter)
#   hero      optional: the id of a record to show first, when its picture may be shown
themes:
