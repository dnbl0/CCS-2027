# The Nationality filter's terms (rake index:normalise, Normalise::Nationalities). PLACEHOLDER: for the collections team to review.
#
# nationality_ssim holds free text ("Australian composer and pianist", "Born Germany. Lived and worked in Australia"). Every word or
# phrase below found in it (whole words, any case) gives its nationality, in the order they appear in the text: "Swedish - American
# artist" gives Swedish and American. Text with none of them gives no term; index:normalise lists those values for review.
#
# Each entry: the nationality as the filter shows it, and the other words that mean it (the country, older names).
