  catalog:
    country_acknowledgement:
      title: "Acknowledgement of Country"
      body_html: |
        <p>The University of Melbourne respectfully acknowledges the Traditional
        Custodians throughout Australia whose cultural heritage, knowledge,
        histories and collections we care for, and the Traditional Custodians of
        the lands on which our campuses, collections and communities are
        situated.</p>
        <p>We recognise their continuing connections to Country, culture and
        community, and pay our respects to Elders past and present.</p>
      advisory: "Aboriginal and Torres Strait Islander people should be aware that the University of Melbourne website and collections contain the names, images and voices of people who have died."
      bias: "Collections Navigator exposes longstanding and deep bias within collecting and descriptive practices. Users of this site are advised that some content, and the description of that content, is outmoded, racist, and culturally inappropriate and may cause distress. The University of Melbourne commits to identifying and addressing these issues, and also to being transparent about documenting such processes."
      continue: "Continue"
      close: "Close"
