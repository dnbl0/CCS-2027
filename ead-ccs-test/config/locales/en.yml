# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#     This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# NOTE: YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  blacklight:
    tools:
      title: "Actions"      # Blacklight ships "Tools"
    # Bookmarks are "saved records" on this site (Blacklight ships "Bookmarks")
    bookmarks:
      title: "Saved records"
      page_title: "Saved records - %{application_name}"
      list_title: "Your saved records"
      no_bookmarks: "You have not saved any records yet."
      clear:
        action_title: "Clear saved records"
        action_confirm: "Remove every record from your saved list?"
        success: "Your saved records have been cleared."
        failure: "Sorry, there was a problem clearing your saved records."
      add:
        button: "Save"
        failure: "Sorry, there was a problem saving the record."
        success:
          one: "Record saved."
          other: "Records saved."
      remove:
        button: "Remove"
        failure: "Sorry, there was a problem removing the record."
        success: "Record removed from your saved list."

  nexus_ccs:
    search_history:
      title: "Search history"
      description: "The searches you have made in this browser, newest first. Open one to run it again, or save the ones you want to keep."
      recent: "Your recent searches"
      column_search: "Search"
      column_filters: "Filters"
      column_actions: "Actions"
      no_term: "All records"
      caption: "Searches from %{day}"
      removed: "Search removed from your history."
      not_found: "That search is no longer in your history."
      actions:
        save: "Save"
        share: "Share"
        delete: "Delete"
        save_named: "Save search: %{query}"
        share_named: "Share search: %{query}"
        delete_named: "Delete search: %{query}"
    saved_searches:
      title: "Saved searches"
      description: "The searches you chose to keep. Open one to run it again."
      list_heading: "Your saved searches"
      empty: "You have not saved any searches yet. Save one from your search history."
      empty_link: "Go to your search history"
      start_searching: "Start searching"
      save: "Save this search"
      save_named: "Save this search: %{query}"
      saved: "Search saved."
      removed: "Search removed from your saved searches."
      remove: "Remove"
      remove_named: "Remove the saved search %{name}"
      not_found: "That search is no longer in your history, so it could not be saved."
      failure: "Sorry, there was a problem saving the search."
    save:
      absent: "Save"
      present: "Saved"
      inprogress: "Saving…"
      record: "record"
    saved_noun:
      one: "saved record"
      other: "saved records"
    saved:
      list_title: "Saved records"
      list_description: "The records you have saved on this device. Open one to see it in full, or select Saved to remove it from the list."
      empty: "You have not saved any records yet."
      empty_link: "Search all records"
    view_full_record:
      label: "View full record"
      title: "You're leaving this site"
      body: "The full record for this item is held on %{source}'s own system, which the University of Melbourne doesn't maintain and isn't responsible for."
      default_source: "another organisation"
      stay: "Stay on this page"
      continue: "Continue to site"
      close: "Close"
    facets:
      pending: "No records have this information yet."
    access_notice:
      view_only:
        title: "You can view this item, but not download it"
        body: "To download it, ask the collection team for access. Your request needs approval."
        link: "Request access to download this item"
      request:
        title: "This item is available on request"
        body: "The image or file is not shown here. To see it, ask the collection team for access. Your request needs approval."
        link: "Request access to this item"

  catalog:
    country_acknowledgement:
      title: "Acknowledgement of Country"
      body_html: |
        <p>The University of Melbourne respectfully acknowledges the Traditional
        Custodians throughout Australia whose cultural heritage, knowledge,
        histories and collections we care for, and the Traditional Custodians of
        the lands on which our campuses, collections and communities are
        situated.</p>
        <p>We recognise their continuing connections to Country, culture and
        community, and pay our respects to Elders past and present.</p>
      advisory: "Aboriginal and Torres Strait Islander people should be aware that the University of Melbourne website and collections contain the names, images and voices of people who have died."
      bias: "Collections Navigator exposes longstanding and deep bias within collecting and descriptive practices. Users of this site are advised that some content, and the description of that content, is outmoded, racist, and culturally inappropriate and may cause distress. The University of Melbourne commits to identifying and addressing these issues, and also to being transparent about documenting such processes."
      continue: "Continue"
      close: "Close"
