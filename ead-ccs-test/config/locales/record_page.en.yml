      download:
        title: "Before you download"
        intro: "Please include this information when you use the image."
        caption: "Caption"
        licence: "Licence"
        copy: "Copy this information"
        download: "Download image"
        close: "Close"
      # The record page's header and sections. PLACEHOLDER WORDING.
      card:
        cite: "How to cite this record"
      # The record page's sections and headings
      layout:
        associated_names: "Associated names"
        overview: "Object overview"
        notes: "Record details and notes"
        full_record: "Full record"
        inscriptions: "Inscriptions and marks"
