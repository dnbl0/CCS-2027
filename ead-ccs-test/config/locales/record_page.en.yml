        licence: "Licence"
        copyright: "Copyright"
        credit_line: "Credit line"
        caption: "Caption"
        responsible_collection: "Responsible collection"
        terms: "About copyright and terms of use"
      about:
        persistent_link: "Persistent link"
      media:
        full_screen: "Full screen"
        exit_full_screen: "Exit full screen"
