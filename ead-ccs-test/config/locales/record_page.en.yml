en:
  nexus_ccs:
    # The record page's layout (NexusCcs::RecordDocumentComponent and the components it draws). Wording marked PLACEHOLDER
    # is for the University and the collection teams to approve.
    record_page:
      no_image:
        # PLACEHOLDER WORDING, NOT YET APPROVED
        sentence: "No image of this record is available online."
        ask: "Ask the collection team about this record"
        ask_new_tab: "(opens in a new tab)"
      access:
        open: "Open: view and download"
        view_only: "View only"
        request: "Available on request"
        download: "Download image"
        download_label: "Download image of %{title}"
      sections:
        key_facts: "Key facts"
        about: "About this record"
      key_facts:
        date: "Date"
        materials: "Materials"
        classification: "Classification"
        subject: "Subject"
        collection: "Collection"
        credit_line: "Credit line"
      copyright:
        terms: "About copyright and terms of use"
      about:
        persistent_link: "Persistent link"
      media:
        # Under the media of a record that shows some of its digital assets and withholds others (their own licence does not
        # let them be shown: AccessPolicy.withheld_assets). PLACEHOLDER WORDING, NOT YET APPROVED: the University must approve it.
        partly_withheld:
          body:
            one: "1 other digital asset of this record is not shown here. Its licence does not yet allow it to be shown online."
            other: "%{count} other digital assets of this record are not shown here. Their licences do not yet allow them to be shown online."
          link:
            one: "Request access to it"
            other: "Request access to them"
      more_like_this:
        heading: "More like this"
      id:
        copy_id: "Copy ID"
        copy_permalink: "Copy permalink"
      # Use and access (CCS-27, 47, 67, 68, 69, 166). PLACEHOLDER WORDING, NOT YET APPROVED: the University must approve it.
      use:
        heading: "Use and access"
        view:
          none: "No image of this object is online"
          open: "You can view the image online"
          view_only: "You can view the image online"
          request: "The image is available on request"
        download:
          open: "You can download the image"
          view_only: "Download is not available"
          request: "Download is not available"
        note:
          view_only: "This media file is for viewing purpose only. Please contact Collections team to use this media file."
          request: "This digital asset is only available on request and approval."
        sensitive: "This record holds sensitive material: its images are shown only after you choose to view them."
        request:
          view_only: "Request to use this image"
          request: "Request to view this image"
        accession_number: "Accession number"
        licence: "Licence"
        caption: "Caption"
        credit_line: "Credit line"
        copyright: "Copyright"
        terms_of_use: "Terms of use"
