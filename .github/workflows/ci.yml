name: CI

# The checks for the 2026 static prototype that still sits in public/ (see docs/decoupling-from-2026.md). It runs only
# when the prototype's own files change. The Rails app has its own workflow (rails-ci.yml).
on:
  pull_request:
    paths:
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'src/**'
      - 'data-model/**'
      - 'api/**'
      - 'package.json'
      - 'eslint.config.js'
      - '.stylelintrc.json'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Audit runtime dependencies
        run: npm audit --omit=dev

      - name: Install Chromium for browser tests
        run: npx playwright-core install --with-deps chromium

      - name: Run tests
        run: npm test
